<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ScenePlay</title>

<style>
*{box-sizing:border-box}

:root{
--bg:#09090d;
--card:#15151d;
--card2:#1d1d27;
--border:#30303b;
--text:#fff;
--muted:#9999a8;
--purple:#8b5cf6;
--purple-light:#b197fc;
--green:#35d07f;
--red:#ff5263
}

body{
margin:0;
background:var(--bg);
color:var(--text);
font-family:Arial,Helvetica,sans-serif;
padding-bottom:80px
}

button{
font:inherit;
cursor:pointer
}

.hidden{display:none!important}

header{
position:fixed;
top:0;
left:0;
right:0;
height:64px;
z-index:100;
display:flex;
justify-content:space-between;
align-items:center;
padding:0 18px;
background:rgba(9,9,13,.95);
backdrop-filter:blur(15px);
border-bottom:1px solid #24242d
}

.logo{
font-size:23px;
font-weight:900
}

.logo span{
color:var(--purple-light)
}

.header-button{
background:var(--card2);
border:1px solid var(--border);
color:#fff;
padding:9px 14px;
border-radius:10px
}

main{
max-width:760px;
margin:auto;
padding:90px 18px 30px
}

.hero{
padding:30px 0 40px
}

.hero h1{
font-size:clamp(50px,12vw,80px);
line-height:.9;
letter-spacing:-5px;
margin:0
}

.hero h1 span{
color:var(--purple-light)
}

.hero p{
color:var(--muted);
font-size:18px;
line-height:1.5;
max-width:600px
}

.badge,.tag{
display:inline-block;
background:#251b37;
color:var(--purple-light);
border:1px solid #40305c;
border-radius:30px;
padding:7px 12px;
font-size:12px;
font-weight:bold
}

.button-row{
display:flex;
gap:10px;
flex-wrap:wrap
}

.btn{
min-height:48px;
padding:12px 18px;
border-radius:11px;
border:0;
font-weight:bold
}

.primary{
background:var(--purple);
color:#fff
}

.secondary{
background:var(--card2);
color:#fff;
border:1px solid var(--border)
}

.danger{
background:#35151c;
color:#ff9ca8
}

.full{
width:100%
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px
}

.card,.scene{
background:var(--card);
border:1px solid var(--border);
border-radius:17px;
padding:18px
}

.scene{
border-radius:18px;
margin-bottom:15px
}

.card h3{
margin:8px 0
}

.card p,.muted{
color:var(--muted);
line-height:1.5
}

.emoji{
font-size:28px
}

.info,.status{
background:#101016;
border:1px solid var(--border);
padding:14px;
border-radius:11px;
margin:10px 0;
line-height:1.5
}

.success{
background:#10281b;
color:#8ff0b3;
border-color:#245d3c
}

.line{
background:#08080b;
border-left:4px solid var(--purple);
border-radius:10px;
padding:18px;
font-size:20px;
line-height:1.45;
margin:15px 0
}

.scene-video{
width:100%;
display:block;
background:#000;
border-radius:14px;
margin:15px 0;
max-height:650px
}

.camera{
background:#000;
border-radius:18px;
overflow:hidden;
margin:15px 0
}

.camera video{
width:100%;
display:block;
aspect-ratio:9/16;
object-fit:cover
}

.response{
background:#101016;
border:1px solid var(--border);
border-radius:15px;
padding:15px;
margin:12px 0
}

.user-row{
display:flex;
align-items:center;
gap:10px
}

.avatar{
width:42px;
height:42px;
border-radius:50%;
background:linear-gradient(135deg,#8b5cf6,#ec4899);
display:flex;
align-items:center;
justify-content:center;
font-weight:bold;
flex-shrink:0
}

input{
width:100%;
background:#0d0d12;
border:1px solid #353540;
color:#fff;
padding:14px;
border-radius:10px;
margin:7px 0 14px
}

label{
font-size:13px;
color:#c8c8d0
}

.modal{
position:fixed;
inset:0;
z-index:500;
background:rgba(0,0,0,.82);
display:flex;
align-items:center;
justify-content:center;
padding:18px
}

.modal-box{
width:min(470px,100%);
max-height:90vh;
overflow:auto;
background:#17171f;
border:1px solid var(--border);
border-radius:20px;
padding:22px
}

.bottom-nav{
position:fixed;
left:0;
right:0;
bottom:0;
height:70px;
z-index:200;
background:rgba(15,15,21,.97);
border-top:1px solid #292933;
backdrop-filter:blur(15px)
}

.nav{
max-width:650px;
height:100%;
margin:auto;
display:flex
}

.nav button{
flex:1;
border:0;
background:none;
color:#858592;
font-size:11px
}

.nav button strong{
display:block;
font-size:21px;
margin-bottom:3px
}

.nav button.active,
.nav button.active strong{
color:#fff
}

.empty{
text-align:center;
padding:35px 15px;
color:var(--muted)
}

@media(max-width:500px){
main{
padding-left:14px;
padding-right:14px
}

.grid{
grid-template-columns:1fr 1fr
}
}
</style>
</head>

========================================================= */

const SUPABASE_URL=
"https://rktwvhenqumebbgrtxol.supabase.co";

const SUPABASE_KEY=
"sb_publishable_wBb0U4jBf3SRM0EIHtgheA_c0pOG-WK";

const supabase=
createClient(

/* =========================================================
   AUTH
========================================================= */

window.accountAction=()=>{
if(currentUser){
profile();
}else{
openAuth();
}

window.openAuth=()=>{
authMode="signup";

document
.getElementById("authModal")
.classList.remove("hidden");

updateAuthForm();
};

window.closeAuth=()=>{
document
.getElementById("authModal")
.classList.add("hidden");
};

window.switchAuth=()=>{
authMode=
authMode==="signup"
?"login"
:"signup";

updateAuthForm();
};

function updateAuthForm(){

const title=
document.getElementById("authTitle");

const username=
document.getElementById("usernameContainer");

const submit=
document.getElementById("authSubmitButton");

const sw=
document.getElementById("authSwitchButton");

if(authMode==="login"){

title.textContent="Log in";

username.classList.add("hidden");

submit.textContent="Log in";

sw.textContent=
"Don't have an account? Create one";

}else{

title.textContent="Create account";

username.classList.remove("hidden");

submit.textContent="Create account";

sw.textContent=
"Already have an account? Log in";

}

}


window.submitAuth=async()=>{

const username=
document.getElementById("authUsername")
.value.trim();

const email=
document.getElementById("authEmail")
.value.trim();

const password=
document.getElementById("authPassword")
.value;

if(
!email||
!password||
(authMode==="signup"&&!username)
){

alert("Please complete all required fields.");
return;

}

if(authMode==="signup"){

const {error}=
await supabase.auth.signUp({

email,
password,

options:{
data:{username},
emailRedirectTo:"https://businesspage.ie"
}

});

if(error){

alert(error.message);
return;

}

closeAuth();

alert(
"Account created. Please check your email and confirm your account."
);

}else{

const {error}=
await supabase.auth.signInWithPassword({
email,
password
});

if(error){

alert(error.message);
return;

}

closeAuth();

await loadUser();

home();

}

};


async function loadUser(){

const {data}=
await supabase.auth.getUser();

currentUser=
data.user||null;

currentProfile=null;

if(currentUser){

const {data:profile}=
await supabase
.from("profiles")
.select("*")
.eq("id",currentUser.id)
.maybeSingle();

currentProfile=
profile||null;

}

updateAccountButton();

}


function updateAccountButton(){

const b=
document.getElementById("accountButton");

b.textContent=
currentProfile
?"@"+currentProfile.username
:currentUser
?"Profile"
:"Log in";

}


window.logout=async()=>{

await supabase.auth.signOut();

currentUser=null;
currentProfile=null;

updateAccountButton();

home();

};


/* =========================================================

/* =========================================================
   CAMERA HELPERS
========================================================= */

function stopCameraTracks(){

if(cameraStream){

cameraStream
.getTracks()
.forEach(track=>track.stop());

cameraStream=null;

}

}


window.cancelCamera=()=>{
stopCameraTracks();
home();
};


/* =========================================================
   OPENING RECORDING
========================================================= */

window.openCameraForOpening=async()=>{

app.innerHTML=`

<h1>🎥 Record your part</h1>

<div class="info">
<strong>Say:</strong><br>
"${escapeHtml(currentScene.lineA)}"
</div>

<div class="info">
<strong>Your objective:</strong><br>
${escapeHtml(currentScene.objectiveA)}
</div>

<div class="camera">

<video
id="cameraVideo"
autoplay
muted
playsinline>
</video>

</div>

<div id="recordStatus" class="status">
Ready
</div>

<button
id="recordButton"
class="btn primary full"
onclick="toggleOpeningRecording()">

🔴 Record

</button>

<br><br>

<button
class="btn secondary full"
onclick="cancelCamera()">

Cancel

</button>

`;

try{

cameraStream=
await navigator.mediaDevices.getUserMedia({
video:{facingMode:"user"},
audio:true
});

document.getElementById("cameraVideo")
.srcObject=cameraStream;

}catch(e){

alert(
"Camera/microphone permission was denied."
);

home();

}

};


window.toggleOpeningRecording=()=>{

if(
!mediaRecorder||
mediaRecorder.state==="inactive"
){

startOpeningRecording();

}else{

stopRecording();

}

};


function startOpeningRecording(){

recordedChunks=[];

let options={};

if(
MediaRecorder.isTypeSupported(
"video/webm;codecs=vp8,opus"
)
){

options.mimeType=
"video/webm;codecs=vp8,opus";

}

mediaRecorder=
new MediaRecorder(
cameraStream,
options
);

mediaRecorder.ondataavailable=e=>{

if(e.data.size){
recordedChunks.push(e.data);
}

};

mediaRecorder.onstop=
reviewRecordedVideo;

mediaRecorder.start();

recordingSeconds=0;

recordingTimer=
setInterval(()=>{

recordingSeconds++;

const s=
document.getElementById("recordStatus");

if(s){

s.textContent=
"🔴 Recording "+
recordingSeconds+
" seconds";

}

if(recordingSeconds>=30){

stopRecording();

}

},1000);

document.getElementById("recordButton")
.textContent="⏹ Stop";

}


function stopRecording(){

if(
mediaRecorder&&
mediaRecorder.state==="recording"
){

mediaRecorder.stop();

}

clearInterval(recordingTimer);

}


/* =========================================================
   REVIEW OPENING
========================================================= */

function reviewRecordedVideo(){

stopCameraTracks();

pendingVideoBlob=
new Blob(
recordedChunks,
{type:"video/webm"}
);

const url=
URL.createObjectURL(
pendingVideoBlob
);

app.innerHTML=`

<h1>Review your video</h1>

<p class="muted">
Make sure you are happy with your performance.
</p>

<div class="camera">

<video
src="${url}"
controls
playsinline>
</video>

</div>

<div class="button-row">

<button
class="btn secondary"
onclick="openCameraForOpening()">

↻ Retake

</button>

<button
class="btn primary"
onclick="uploadOpeningVideo()">

✓ Publish Scene

</button>

</div>

`;

}


/* =========================================================
   UPLOAD OPENING
========================================================= */

window.uploadOpeningVideo=async()=>{

if(!pendingVideoBlob){

alert("There is no recorded video.");
return;

}

showLoading("Uploading your scene...");

try{

const sceneId=
crypto.randomUUID();

const videoPath=
currentUser.id+
"/"+
sceneId+
"/opening.webm";


let {error}=
await supabase.storage
.from("scene-videos")
.upload(
videoPath,
pendingVideoBlob,
{
contentType:"video/webm",
upsert:false
}
);

if(error)throw error;


const {data:urlData}=
supabase.storage
.from("scene-videos")
.getPublicUrl(videoPath);

const videoUrl=
urlData.publicUrl;


({error}=
await supabase
.from("scenes")
.insert({

id:sceneId,

creator_id:
currentUser.id,

title:
currentScene.title,

category:
currentScene.category,

situation:
currentScene.situation,

character_a:
currentScene.characterA,

character_b:
currentScene.characterB,

objective_a:
currentScene.objectiveA,

objective_b:
currentScene.objectiveB,

opening_line:
currentScene.lineA,

status:"open"

}));

if(error)throw error;


({error}=
await supabase
.from("scene_turns")
.insert({

id:crypto.randomUUID(),

scene_id:sceneId,

player_id:
currentUser.id,

turn_number:1,

video_path:videoUrl

}));

if(error)throw error;


pendingVideoBlob=null;

showPublishedScene(
sceneId,
videoUrl
);

}catch(e){

console.error(e);

alert(
"Upload failed:\n\n"+
e.message
);

home();

}

};


/* =========================================================
   PUBLISHED SCENE
========================================================= */

function showPublishedScene(
sceneId,
videoUrl
){

app.innerHTML=`

<div class="scene">

<div class="status success">
✓ Your scene is live
</div>

<h1>
${escapeHtml(currentScene.title)}
</h1>

<video
class="scene-video"
controls
playsinline
preload="metadata"
src="${escapeHtml(videoUrl)}">
</video>

<p class="muted">
Other people can now respond as Character B.
</p>

onclick="discover()">

}


/* =========================================================
   DISCOVER
========================================================= */

window.discover=async()=>{

showLoading("Loading scenes...");

const {data:scenes,error}=
await supabase
.from("scenes")
.select(`*,profiles(username)`)
.order(
"created_at",
{ascending:false}
);

if(error){

alert(error.message);
home();
return;

}

app.innerHTML=`

<h1>🔥 Discover</h1>

<p class="muted">
Find someone to play with.
</p>

`;

if(!scenes?.length){

app.innerHTML+=`

<div class="empty">

<h2>No scenes yet</h2>

<button
class="btn primary"
onclick="createScene()">

Create Scene

</button>

</div>

`;

return;

}


for(const scene of scenes){

const videoUrl=
await getOpeningVideo(scene.id);

let action="";

if(scene.status==="ended"){

action=`

<div class="status">
Scene ended
</div>

`;

}else{

const myResponse=
currentUser
?await getMyResponseSafe(scene.id)
:null;

if(myResponse){

action=`

<button
class="btn secondary full"
onclick="showMyResponse('${scene.id}')">

✓ My Response
(${escapeHtml(myResponse.status||"pending")})

</button>

`;

}else{

action=`

<button
class="btn primary full"
onclick="respondToScene('${scene.id}')">

🎭 Play Character B

</button>

`;

}

}


app.innerHTML+=`

<div class="scene">

<span class="tag">
${escapeHtml(scene.category||"Scene")}
</span>

<h2>
${escapeHtml(scene.title)}
</h2>

<p class="muted">
${escapeHtml(scene.situation)}
</p>

${
videoUrl
?
`
<video
class="scene-video"
controls
playsinline
preload="metadata"
src="${escapeHtml(videoUrl)}">
</video>
`
:
`
<div class="status">
Video unavailable
</div>
`
}

<p class="muted">
Created by @${escapeHtml(
scene.profiles?.username||"player"
)}
</p>

${action}

</div>

`;

}

};


async function getOpeningVideo(sceneId){

    const {data:turn,error} =

window.showActiveScene=async sceneId=>{

return;

try{

const {data:scene,error:sceneError}=
await supabase
.from("scenes")
.select("*")
.eq("id",sceneId)
.single();

if(sceneError)throw sceneError;


const turns=
await getSceneTurns(sceneId);


const {
data:accepted,
error:acceptedError
}=
await supabase
.from("scene_responses")
.select(
"responder_id,status"
)
.eq(
"scene_id",
sceneId
)
.eq(
"status",
"accepted"
)
.maybeSingle();

if(acceptedError)throw acceptedError;


const bId=
accepted?.responder_id||null;

const last=
turns.length
?turns[turns.length-1]
:null;


/*
NEXT PLAYER LOGIC

Turn 1 = A
Turn 2 = B
Turn 3 = A
Turn 4 = B
Turn 5 = A

If the last turn was A,
B goes next.

If the last turn was B,
A goes next.
*/

let expectedPlayerId=null;


if(
scene.status==="in_progress" &&
bId &&
last
){

if(
last.player_id===
scene.creator_id
){

expectedPlayerId=
bId;

}else if(
last.player_id===
bId
){

expectedPlayerId=
scene.creator_id;

}

}


const myTurn=
scene.status!=="ended" &&
expectedPlayerId===
currentUser.id;


let turnMessage="";


if(scene.status==="ended"){

turnMessage=
"✓ Scene ended";

}else if(myTurn){

turnMessage=
"🎭 Your turn";

}else if(expectedPlayerId){

turnMessage=
"⏳ Waiting for the other player";

}else{

turnMessage=
"⏳ Waiting for the scene to start";

}


app.innerHTML=`

</span>

${escapeHtml(scene.title)}
</h1>

class="status
${scene.status==="ended"
?"success"
:myTurn
?"success"
:""}">

${turnMessage}

${
scene.status!=="ended" &&
myTurn
?
`

<button
class="btn primary full"
onclick="recordNextTurn('${scene.id}')">

🎥 Record your next turn

</button>

<br><br>

`
:
""
}


${
scene.status!=="ended" &&
scene.creator_id===currentUser.id
?
`

<button
class="btn danger full"
onclick="endScene('${scene.id}')">

🛑 End Scene

</button>

`
:
""
}

<br><br>

<button
class="btn secondary full"
onclick="viewResponses('${scene.id}')">

← Back to Responses

</button>

</div>

`;


const box=
document.getElementById(
"activeTurns"
);


turns.forEach(t=>{

let playerLabel="Other player";

if(
t.player_id===
currentUser.id
){

playerLabel="You";

}else if(
t.player_id===
scene.creator_id
){

playerLabel="Character A";

}else{

playerLabel="Character B";

}


box.innerHTML+=`

<div class="info">

<strong>
Turn ${escapeHtml(t.turn_number)}
</strong>

—
${playerLabel}

</div>

<video
class="scene-video"
controls
playsinline
preload="metadata"
src="${escapeHtml(t.video_path)}">
</video>

`;

});


}catch(e){

console.error(e);

alert(
"Could not load scene:\n\n"+
e.message
);

}

};


/* =========================================================
   RECORD NEXT TURN
   A OR B CAN USE THIS
========================================================= */

window.recordNextTurn=async sceneId=>{

if(!currentUser){

openAuth();
return;

}

currentResponseSceneId=
sceneId;


const {data:scene,error}=
await supabase
.from("scenes")
.select("*")
.eq("id",sceneId)
.single();

if(error){

alert(error.message);
return;

}

currentScene=scene;


app.innerHTML=`

<h1>
🎥 Record your next turn
</h1>

<p class="muted">
Continue the scene naturally.
</p>

<div class="camera">

<video
id="nextTurnCamera"
autoplay
muted
playsinline>
</video>

</div>

<div
id="nextTurnStatus"
class="status">

Ready

</div>

<button
id="nextTurnRecordButton"
class="btn primary full"
onclick="toggleNextTurnRecording()">

🔴 Record

</button>

<br><br>

<button
class="btn secondary full"
onclick="showActiveScene('${sceneId}')">

Cancel

</button>

`;


try{

cameraStream=
await navigator.mediaDevices.getUserMedia({

video:{facingMode:"user"},
audio:true

});

document.getElementById(
"nextTurnCamera"
).srcObject=
cameraStream;

}catch(e){

alert(
"Camera/microphone permission was denied."
);

showActiveScene(sceneId);

}

};


/* =========================================================
   NEXT TURN RECORDING
========================================================= */

window.toggleNextTurnRecording=()=>{

if(
!mediaRecorder||
mediaRecorder.state==="inactive"
){

startNextTurnRecording();

}else{

stopRecording();

}

};


function startNextTurnRecording(){

recordedChunks=[];

let options={};

if(
MediaRecorder.isTypeSupported(
"video/webm;codecs=vp8,opus"
)
){

options.mimeType=
"video/webm;codecs=vp8,opus";

}


mediaRecorder=
new MediaRecorder(
cameraStream,
options
);


mediaRecorder.ondataavailable=e=>{

if(e.data.size){

recordedChunks.push(e.data);

}

};


mediaRecorder.onstop=
reviewNextTurn;


mediaRecorder.start();

recordingSeconds=0;


recordingTimer=
setInterval(()=>{

recordingSeconds++;

const s=
document.getElementById(
"nextTurnStatus"
);

if(s){

s.textContent=
"🔴 Recording "+
recordingSeconds+
" seconds";

}

if(recordingSeconds>=30){

stopRecording();

}

},1000);


const button=
document.getElementById(
"nextTurnRecordButton"
);

if(button){

button.textContent=
"⏹ Stop";

}

}


/* =========================================================
   REVIEW NEXT TURN
========================================================= */

function reviewNextTurn(){

stopCameraTracks();

pendingVideoBlob=
new Blob(
recordedChunks,
{type:"video/webm"}
);

const url=
URL.createObjectURL(
pendingVideoBlob
);


app.innerHTML=`

<h1>
Review your next turn
</h1>

<p class="muted">
Make sure you are happy with your continuation.
</p>

<div class="camera">

<video
src="${url}"
controls
playsinline>
</video>

</div>

<div class="button-row">

<button
class="btn secondary"
onclick="recordNextTurn('${currentResponseSceneId}')">

↻ Retake

</button>

<button
class="btn primary"
onclick="uploadNextTurn()">

✓ Add Turn

</button>

</div>

`;

}


/* =========================================================
   UPLOAD NEXT TURN
   THIS GOES INTO scene_turns
========================================================= */

window.uploadNextTurn=async()=>{

if(!pendingVideoBlob){

alert("No turn video.");
return;

}

if(
!currentUser||
!currentResponseSceneId
){

alert(
"Your session or scene is missing."
);

return;

}


showLoading(
"Uploading your turn..."
);


let videoPath=null;


try{

const sceneId=
currentResponseSceneId;


/* Get scene */

const {data:scene,error:sceneError}=
await supabase
.from("scenes")
.select("*")
.eq("id",sceneId)
.single();

if(sceneError)throw sceneError;


if(scene.status!=="in_progress"){

throw new Error(
"This scene is not active."
);

}


/* Get current turns */

const turns=
await getSceneTurns(sceneId);


const last=
turns[turns.length-1];


if(!last){

throw new Error(
"No previous turn exists."
);

}


/* Find accepted B */

const {
data:accepted,
error:acceptedError
}=
await supabase
.from("scene_responses")
.select("responder_id")
.eq("scene_id",sceneId)
.eq("status","accepted")
.maybeSingle();

if(acceptedError)throw acceptedError;


const bId=
accepted?.responder_id;


if(!bId){

throw new Error(
"No accepted player was found."
);

}


/*
CHECK WHO SHOULD RECORD

If last turn was A,
B must record.

If last turn was B,
A must record.
*/

let expectedPlayerId=null;


if(
last.player_id===
scene.creator_id
){

expectedPlayerId=
bId;

}else if(
last.player_id===
bId
){

expectedPlayerId=
scene.creator_id;

}


if(
expectedPlayerId!==
currentUser.id
){

throw new Error(
"It is not your turn."
);

}


/* Next number */

const nextTurnNumber=
Number(last.turn_number)+1;


/* Unique ID */

const turnId=
crypto.randomUUID();


/* Storage path */

videoPath=
currentUser.id+
"/turns/"+
turnId+
".webm";


/* Upload video */

const {error:uploadError}=
await supabase.storage
.from("scene-videos")
.upload(
videoPath,
pendingVideoBlob,
{
contentType:"video/webm",
upsert:false
}
);


if(uploadError){

throw uploadError;

}


/* Public URL */

const {data:urlData}=
supabase.storage
.from("scene-videos")
.getPublicUrl(
videoPath
);


const videoUrl=
urlData.publicUrl;


/* Insert turn */

const {error:turnError}=
await supabase
.from("scene_turns")
.insert({

id:turnId,

scene_id:sceneId,

player_id:
currentUser.id,

turn_number:
nextTurnNumber,

video_path:
videoUrl

});


if(turnError){

/* Delete uploaded file if DB insert fails */

await supabase.storage
.from("scene-videos")
.remove([videoPath]);

throw turnError;

}


/* Success */

pendingVideoBlob=null;

await showActiveScene(
sceneId
);


}catch(e){

console.error(e);

alert(
"Turn upload failed:\n\n"+
e.message
);

showActiveScene(
currentResponseSceneId
);

}

};


/* =========================================================
   END SCENE
========================================================= */

window.endScene=async sceneId=>{

if(!currentUser)return;

if(
!confirm(
"End this scene?\n\nNobody will be able to record another turn."
)
){

return;

}


const {error}=
await supabase
.from("scenes")
.update({
status:"ended"
})
.eq(
"id",
sceneId
)
.eq(
"creator_id",
currentUser.id
);


if(error){

alert(error.message);
return;

}


await showActiveScene(sceneId);

};


/* =========================================================
   PROFILE
========================================================= */

window.profile=()=>{

if(!currentUser){

openAuth();
return;

}

const username=
currentProfile?.username||
"player";


app.innerHTML=`

<div class="scene">

<div class="avatar">

${escapeHtml(
username[0]
).toUpperCase()}

</div>

<h1>
@${escapeHtml(username)}
</h1>

<p class="muted">
ScenePlay player
</p>

<button
class="btn primary full"
onclick="myScenes()">

🎬 My Scenes

</button>

<br><br>

<button
class="btn danger full"
onclick="logout()">

Log out

</button>

</div>

`;

};


/* =========================================================
   HELPERS
========================================================= */

function showLoading(text){

app.innerHTML=`

<div class="scene">

<h2>
${escapeHtml(text)}
</h2>

<div class="status">
Please wait...
</div>

</div>

`;

}


function escapeHtml(v){

if(
v===null||
v===undefined
){

return "";

}

return String(v)

.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}


/* =========================================================
   AUTH STATE
========================================================= */

supabase.auth.onAuthStateChange(
async(event,session)=>{

currentUser=
session?.user||null;

await loadUser();

}
);


await loadUser();

home();

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1">

<meta name="theme-color" content="#09090d">

<title>ScenePlay</title>

<style>

:root{
    --bg:#09090d;
    --card:#15151d;
    --card2:#1d1d27;
    --border:#2b2b37;
    --text:#fff;
    --muted:#9999a8;
    --purple:#8b5cf6;
    --purple2:#a78bfa;
    --green:#35d07f;
    --red:#ff5263;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:Arial,Helvetica,sans-serif;
    padding-bottom:80px;
}

button{
    font:inherit;
    cursor:pointer;
    border:0;
}

.hidden{
    display:none!important;
}

header{
    position:fixed;
    top:0;
    left:0;
    right:0;
    height:64px;
    z-index:100;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 18px;

    background:rgba(9,9,13,.95);
    backdrop-filter:blur(15px);

    border-bottom:1px solid #20202a;
}

.logo{
    font-size:22px;
    font-weight:900;
    letter-spacing:-1px;
}

.logo span{
    color:var(--purple2);
}

.header-button{
    background:var(--card2);
    color:white;

    border:1px solid var(--border);

    padding:9px 13px;
    border-radius:10px;
}

main{
    max-width:760px;
    margin:auto;
    padding:88px 18px 30px;
}

h1{
    letter-spacing:-1px;
}

.hero{
    padding:35px 0;
}

.hero h1{
    font-size:clamp(45px,12vw,75px);
    line-height:.92;
    margin:0;
    letter-spacing:-4px;
}

.hero h1 span{
    color:var(--purple2);
}

.hero p{
    color:var(--muted);
    font-size:18px;
    line-height:1.5;
    max-width:600px;
    margin:22px 0;
}

.badge{
    display:inline-block;

    background:#241b35;
    color:var(--purple2);

    border:1px solid #3c2c58;

    padding:7px 11px;
    border-radius:30px;

    font-size:12px;
    font-weight:bold;

    margin-bottom:20px;
}

.button-row{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.btn{
    min-height:50px;
    padding:13px 18px;

    border-radius:12px;

    font-weight:bold;
}

.primary{
    background:var(--purple);
    color:white;
}

.primary:hover{
    background:#794bd9;
}

.secondary{
    background:var(--card2);
    color:white;

    border:1px solid var(--border);
}

.danger{
    background:#361820;
    color:#ff9ca8;
}

.full{
    width:100%;
}

.section-title{
    margin-top:35px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
}

.card{
    background:var(--card);

    border:1px solid var(--border);

    border-radius:17px;

    padding:17px;
}

.card h3{
    margin:0 0 8px;
}

.card p{
    color:var(--muted);
    line-height:1.5;
}

.emoji{
    font-size:28px;
    margin-bottom:12px;
}

.scene{
    background:var(--card);

    border:1px solid var(--border);

    border-radius:18px;

    padding:18px;

    margin-bottom:13px;
}

.tag{
    display:inline-block;

    background:#241b35;
    color:var(--purple2);

    padding:5px 9px;

    border-radius:30px;

    font-size:12px;
    font-weight:bold;
}

.muted{
    color:var(--muted);
}

.line{
    background:#08080b;

    border-left:4px solid var(--purple);

    border-radius:10px;

    padding:18px;

    margin:20px 0;

    font-size:21px;

    line-height:1.45;
}

.info{
    background:#111118;

    border:1px solid var(--border);

    padding:15px;

    border-radius:12px;

    color:#c7c7d0;

    line-height:1.5;

    margin:12px 0;
}

.status{
    background:#191921;

    border:1px solid var(--border);

    padding:14px;

    border-radius:12px;

    margin:14px 0;
}

.success{
    background:#10281b;
    color:#8ff0b3;
}

.warning{
    background:#292313;
    color:#f1d279;
}

.camera{
    background:#000;

    border-radius:20px;

    overflow:hidden;

    margin:18px 0;
}

.camera video{
    width:100%;

    display:block;

    aspect-ratio:9/16;

    object-fit:cover;
}

.feed-video{
    width:100%;

    border-radius:14px;

    background:#000;
}

.response{
    background:#101016;

    border:1px solid var(--border);

    border-radius:15px;

    padding:15px;

    margin-bottom:12px;
}

.user-row{
    display:flex;

    align-items:center;

    margin-bottom:12px;
}

.avatar{
    width:40px;
    height:40px;

    border-radius:50%;

    background:linear-gradient(
        135deg,
        #8b5cf6,
        #ec4899
    );

    display:flex;

    align-items:center;
    justify-content:center;

    font-weight:bold;

    margin-right:10px;
}

input{
    width:100%;

    background:#0d0d12;

    color:white;

    border:1px solid #34343f;

    padding:14px;

    border-radius:10px;

    margin:7px 0 14px;
}

label{
    color:#c6c6d0;

    font-size:13px;
}

.modal{
    position:fixed;

    inset:0;

    z-index:500;

    background:rgba(0,0,0,.8);

    display:flex;

    align-items:center;
    justify-content:center;

    padding:18px;
}

.modal-box{
    width:min(480px,100%);

    background:#17171f;

    border:1px solid var(--border);

    border-radius:20px;

    padding:22px;
}

.bottom-nav{
    position:fixed;

    bottom:0;
    left:0;
    right:0;

    height:70px;

    z-index:200;

    background:rgba(15,15,21,.96);

    backdrop-filter:blur(15px);

    border-top:1px solid #292933;
}

.nav{
    max-width:600px;

    margin:auto;

    height:100%;

    display:flex;
}

.nav button{
    flex:1;

    background:none;

    color:#858592;

    font-size:11px;
}

.nav button strong{
    display:block;

    font-size:21px;

    margin-bottom:3px;
}

.nav button.active{
    color:white;
}

.nav button.active strong{
    color:var(--purple2);
}

@media(max-width:500px){

    .grid{
        grid-template-columns:1fr 1fr;
    }

    .button-row .btn{
        flex:1;
    }

}

</style>

</head>

const SUPABASE_URL =

const SCENES = [

nextB:

];


/* =====================================================
   STATE
   ===================================================== */

let currentUser=null;
let currentProfile=null;
let currentScene=null;

let cameraStream=null;
let mediaRecorder=null;
let chunks=[];
let recordingTimer=null;
let recordingSeconds=0;


/* =====================================================
   AUTH
   ===================================================== */

window.accountAction=function(){

    if(currentUser){

        profile();

    }else{

        openAuth();

    }

};


let authMode="signup";


window.openAuth=function(){

    authMode="signup";

    document
    .getElementById("authModal")
    .classList.remove("hidden");

    document
    .getElementById("authTitle")
    .textContent="Create account";

};


window.closeAuth=function(){

    document
    .getElementById("authModal")
    .classList.add("hidden");

};


window.switchAuth=function(){

    authMode =
        authMode==="signup"
        ? "login"
        : "signup";

    document
    .getElementById("authTitle")
    .textContent =
        authMode==="signup"
        ? "Create account"
        : "Log in";

};


window.submitAuth=async function(){

    const username =
        document
        .getElementById("authUsername")
        .value
        .trim();

    const email =
        document
        .getElementById("authEmail")
        .value
        .trim();

    const password =
        document
        .getElementById("authPassword")
        .value;


    if(!email || !password){

        alert(
            "Please enter email and password."
        );

        return;

    }


    if(authMode==="signup"){

        if(!username){

            alert(
                "Please choose a username."
            );

            return;

        }


        const {
            data,
            error
        } =
        await supabase.auth.signUp({

            email,
            password,

            options:{
                data:{
                    username
                }
            }

        });


        if(error){

            alert(error.message);

            return;

        }


        if(data.user){

            /*
                The database trigger creates
                the profile automatically.
            */

            alert(
                "Account created! Check your email if Supabase requires email confirmation."
            );

        }

    }else{

        const {
            error
        } =
        await supabase.auth
        .signInWithPassword({

            email,
            password

        });


        if(error){

            alert(error.message);

            return;

        }

    }


    closeAuth();

    await loadUser();

    home();

};


/* =====================================================
   USER
   ===================================================== */

async function loadUser(){

    const {
        data
    } =
    await supabase.auth
    .getUser();

    currentUser =
        data.user || null;


    if(currentUser){

        const {
            data:profile
        } =
        await supabase

        .from("profiles")

        .select("*")

        .eq(
            "id",
            currentUser.id
        )

        .maybeSingle();

        currentProfile=profile;

    }else{

        currentProfile=null;

    }


    updateAccountButton();

}


function updateAccountButton(){

    const button =
        document
        .getElementById(
            "accountButton"
        );


    if(currentProfile){

        button.textContent =
            "@"+currentProfile.username;

    }else{

        button.textContent="Log in";

    }

}


window.logout=async function(){

    await supabase.auth.signOut();

    currentUser=null;
    currentProfile=null;

    updateAccountButton();

    home();

};

/* =====================================================
   CREATE SCENE
   ===================================================== */

window.createScene=function(){

    if(!currentUser){

        return;

    }


    app.innerHTML=`

    <h1>
        🎬 Choose a scene
    </h1>

    <p class="muted">

};


/* =====================================================
   PREVIEW
   ===================================================== */

window.previewScene=function(index){

    currentScene=SCENES[index];

    <div class="scene">

        </span>

/* =====================================================
   CAMERA
   ===================================================== */

window.openCamera=async function(){

    app.innerHTML=`

    <h1>
        🎥 Record your part
    </h1>

    <div class="info">

        <strong>
            Your objective:
        </strong>

        <br>

        ${currentScene.objectiveA}

    </div>


    <div class="line">

        "${currentScene.lineA}"

    </div>


    <div class="camera">

        <video
            id="cameraVideo"
            autoplay
            muted
            playsinline>
        </video>

    </div>


    <div id="recordStatus"
         class="status">

        Ready to record

    </div>


    <div class="button-row">

        <button
            id="recordButton"
            class="btn primary"
            onclick="toggleRecording()">

            🔴 Record

        </button>

        <button
            class="btn secondary"
            onclick="stopCamera()">

            Cancel

        </button>

    </div>

    `;


    try{

        cameraStream =
            await navigator.mediaDevices
            .getUserMedia({

                video:{
                    facingMode:"user"
                },

                audio:true

            });


        document
        .getElementById("cameraVideo")
        .srcObject=cameraStream;


    }catch(error){

        alert(
            "Camera access was denied. Please allow camera and microphone access."
        );

        home();

    }

};


window.toggleRecording=function(){

    if(
        !mediaRecorder ||
        mediaRecorder.state==="inactive"
    ){

        startRecording();

    }else{

        stopRecording();

    }

};


function startRecording(){

    chunks=[];


    let options={};


    if(
        MediaRecorder.isTypeSupported(
            "video/webm"
        )
    ){

        options.mimeType="video/webm";

    }


    mediaRecorder =
        new MediaRecorder(
            cameraStream,
            options
        );


    mediaRecorder.ondataavailable =
        event=>{

            if(event.data.size){

                chunks.push(
                    event.data
                );

            }

        };


    mediaRecorder.onstop =
        reviewRecording;


    mediaRecorder.start();


    recordingSeconds=0;


    recordingTimer =
        setInterval(()=>{

            recordingSeconds++;


            document
            .getElementById("recordStatus")
            .textContent =
                "🔴 Recording "
                +
                recordingSeconds
                +
                " / 30 seconds";


            if(
                recordingSeconds>=30
            ){

                stopRecording();

            }

        },1000);


    document
    .getElementById("recordButton")
    .textContent="⏹ Stop";

}


function stopRecording(){

    if(!mediaRecorder)
        return;


    if(
        mediaRecorder.state==="recording"
    ){

        mediaRecorder.stop();

    }


    clearInterval(
        recordingTimer
    );

}


window.stopCamera=function(){

    stopCameraTracks();

    home();

};


function stopCameraTracks(){

    if(cameraStream){

        cameraStream
        .getTracks()
        .forEach(
            track=>track.stop()
        );

        cameraStream=null;

    }

}


/* =====================================================
   REVIEW
   ===================================================== */

function reviewRecording(){

    stopCameraTracks();


    const blob =
        new Blob(
            chunks,
            {
                type:"video/webm"
            }
        );


    const url =
        URL.createObjectURL(blob);


    window.pendingVideoBlob=blob;


    app.innerHTML=`

    <h1>
        Review your video
    </h1>

    <p class="muted">
        Make sure you're happy with it.
    </p>


    <div class="camera">

        <video
            src="${url}"
            controls
            playsinline>
        </video>

    </div>


    <div class="button-row">

        <button
            class="btn secondary"
            onclick="openCamera()">

            ↻ Retake

        </button>


        <button
            class="btn primary"
            onclick="uploadOpening()">

            ✓ Use this video

        </button>

    </div>

    `;

}


/* =====================================================
   UPLOAD OPENING
   ===================================================== */

window.uploadOpening=async function(){

    if(!window.pendingVideoBlob){

        alert("Video missing.");

        return;

    }


    showLoading(
        "Uploading your scene..."
    );


    try{

        const sceneId =
            crypto.randomUUID();


        const path =
            currentUser.id
            +
            "/"
            +
            sceneId
            +
            "/opening.webm";


        const {
            error:uploadError
        } =
        await supabase
        .storage
        .from("scene-videos")
        .upload(
            path,
            window.pendingVideoBlob,
            {
                contentType:
                    "video/webm",
                upsert:true
            }
        );


        if(uploadError)
            throw uploadError;


        const {
            data:urlData
        } =
        supabase
        .storage
        .from("scene-videos")
        .getPublicUrl(path);


        const {
            error:sceneError
        } =
        await supabase
        .from("scenes")
        .insert({

            id:sceneId,

            creator_id:
                currentUser.id,

            title:
                currentScene.title,

            category:
                currentScene.category,

            situation:
                currentScene.situation,

            character_a:
                currentScene.A,

            character_b:
                currentScene.B,

            objective_a:
                currentScene.objectiveA,

            objective_b:
                currentScene.objectiveB,

            opening_line:
                currentScene.lineA,

            status:"open"

        });


        if(sceneError)
            throw sceneError;


        const {
            error:turnError
        } =
        await supabase
        .from("scene_turns")
        .insert({

            scene_id:
                sceneId,

            player_id:
                currentUser.id,

            turn_number:1,

            video_path:
                urlData.publicUrl

        });


        if(turnError)
            throw turnError;


        window.pendingVideoBlob=null;


        showSceneCreated(sceneId);


    }catch(error){

        console.error(error);

        alert(
            "Upload failed: "
            +
            error.message
        );

        home();

    }

};

/* =====================================================
   RECORD RESPONSE
   ===================================================== */

window.recordResponse=async function(sceneId){

    currentResponseSceneId=sceneId;


    app.innerHTML=`

    <h1>
        🎥 Your response
    </h1>

    <div class="camera">

        <video
            id="responseCamera"
            autoplay
            muted
            playsinline>
        </video>

    </div>


    <div
        id="responseStatus"
        class="status">

        Ready

    </div>


    <div class="button-row">

        <button
            id="responseRecordButton"
            class="btn primary"
            onclick="toggleResponseRecording()">

            🔴 Record

        </button>

        <button
            class="btn secondary"
            onclick="stopCamera()">

            Cancel

        </button>

    </div>

    `;


    try{

        cameraStream =
            await navigator.mediaDevices
            .getUserMedia({

                video:{
                    facingMode:"user"
                },

                audio:true

            });


        document
        .getElementById(
            "responseCamera"
        )
        .srcObject=cameraStream;


    }catch(error){

        alert(
            "Camera access denied."
        );

        home();

    }

};


let currentResponseSceneId=null;


window.toggleResponseRecording=function(){

    if(
        !mediaRecorder ||
        mediaRecorder.state==="inactive"
    ){

        startResponseRecording();

    }else{

        stopResponseRecording();

    }

};


function startResponseRecording(){

    chunks=[];


    let options={};


    if(
        MediaRecorder.isTypeSupported(
            "video/webm"
        )
    ){

        options.mimeType="video/webm";

    }


    mediaRecorder =
        new MediaRecorder(
            cameraStream,
            options
        );


    mediaRecorder.ondataavailable =
        e=>{

            if(e.data.size)
                chunks.push(e.data);

        };


    mediaRecorder.onstop =
        reviewResponse;


    mediaRecorder.start();


    recordingSeconds=0;


    recordingTimer =
        setInterval(()=>{

            recordingSeconds++;


            document
            .getElementById(
                "responseStatus"
            )
            .textContent =
                "🔴 Recording "
                +
                recordingSeconds
                +
                " / 30 seconds";


            if(
                recordingSeconds>=30
            ){

                stopResponseRecording();

            }

        },1000);


    document
    .getElementById(
        "responseRecordButton"
    )
    .textContent="⏹ Stop";

}


function stopResponseRecording(){

    if(!mediaRecorder)
        return;


    if(
        mediaRecorder.state==="recording"
    ){

        mediaRecorder.stop();

    }


    clearInterval(
        recordingTimer
    );

}


function reviewResponse(){

    stopCameraTracks();


    const blob =
        new Blob(
            chunks,
            {
                type:"video/webm"
            }
        );


    const url =
        URL.createObjectURL(blob);


    window.pendingResponseBlob=blob;


    app.innerHTML=`

    <h1>
        Review response
    </h1>


    <div class="camera">

        <video
            src="${url}"
            controls
            playsinline>
        </video>

    </div>


    <div class="button-row">

        <button
            class="btn secondary"
            onclick="recordResponse('${currentResponseSceneId}')">

            ↻ Retake

        </button>


        <button
            class="btn primary"
            onclick="uploadResponse()">

            ✓ Send response

        </button>

    </div>

    `;

}


/* =====================================================
   UPLOAD RESPONSE
   ===================================================== */

window.uploadResponse=async function(){

    if(!window.pendingResponseBlob){

        alert("Video missing.");

        return;

    }


    showLoading(
        "Sending your response..."
    );


    try{

        const responseId =
            crypto.randomUUID();


        const path =
            currentUser.id
            +
            "/responses/"
            +
            responseId
            +
            ".webm";


        const {
            error:uploadError
        } =
        await supabase
        .storage
        .from("scene-videos")
        .upload(
            path,
            window.pendingResponseBlob,
            {
                contentType:
                    "video/webm",
                upsert:true
            }
        );


        if(uploadError)
            throw uploadError;


        const {
            data:urlData
        } =
        supabase
        .storage
        .from("scene-videos")
        .getPublicUrl(path);


        const {
            error
        } =
        await supabase

        .from("scene_responses")

        .insert({

            id:
                responseId,

            scene_id:
                currentResponseSceneId,

            responder_id:
                currentUser.id,

            video_path:
                urlData.publicUrl,

            status:"pending"

        });


        if(error)
            throw error;


        window.pendingResponseBlob=null;


        app.innerHTML=`

        <div class="scene">

            <div class="status success">

                ✓ Response sent

            </div>

            <h1>
                Now you wait.
            </h1>

            <p class="muted">

                The creator can watch your
                response and choose you.

                You don't need to stay online.

            </p>


            <button
                class="btn secondary full"
                onclick="discover()">

                Find another scene

            </button>

        </div>

        `;


    }catch(error){

        console.error(error);

        alert(
            "Upload failed: "
            +
            error.message
        );

        home();

    }

};


/* =====================================================
   VIEW RESPONSES

};


/* =====================================================
   CHOOSE RESPONSE
   ===================================================== */

window.chooseResponse=async function(
    responseId,
    sceneId
){

    const {
        error
    } =
    await supabase

    .from("scene_responses")

    .update({
        status:"accepted"
    })

    .eq(
        "id",
        responseId
    );


    if(error){

        alert(error.message);

        return;

    }


    await supabase

    .from("scene_responses")

    .update({
        status:"rejected"
    })

    .eq(
        "scene_id",
        sceneId
    )
    .neq(
        "id",
        responseId
    );


    await supabase

    .from("scenes")

    .update({
        status:"in_progress"
    })

    .eq(
        "id",
        sceneId
    );


    alert(
        "Player selected! The scene can now continue."
    );


    myScenes();

};


window.rejectResponse=async function(
    responseId
){

    await supabase

    .from("scene_responses")

    .update({
        status:"rejected"
    })

    .eq(
        "id",
        responseId
    );


    alert(
        "Response passed."
    );

};


/* =====================================================
   MY SCENES
   ===================================================== */

window.myScenes=async function(){

    if(!currentUser){

        openAuth();

    }


    const {
        data,
        error
    } =
    await supabase

    .from("scenes")

    .select("*")

        "creator_id",
        currentUser.id
    )

    .order(
        "created_at",
        {
            ascending:false
        }
    );


    if(error){

        alert(error.message);

        return;

    }


    app.innerHTML=`

    <h1>
        🎬 My Scenes
    </h1>

    `;


    if(!data.length){

        app.innerHTML+=`

        <div class="info">

            You haven't created a scene yet.

        </div>

        <button

            onclick="createScene()">

            Start your first scene

        </button>

        `;

        return;

    }


    data.forEach(scene=>{

        <div class="scene">

            <span class="tag">

/* =====================================================
   LOADING
   ===================================================== */

function showLoading(text){

    app.innerHTML=`

    <div class="scene">

        <h2>
            ${text}
        </h2>

        <div class="status">
            Please wait...
        </div>

    </div>

    `;

}


/* =====================================================
   ESCAPE HTML
   ===================================================== */

function escapeHtml(text){

    if(!text)
        return "";

    return String(text)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* =====================================================
   AUTH STATE
   ===================================================== */

supabase.auth
.onAuthStateChange(
    async(event,session)=>{

        currentUser =
            session?.user || null;

        await loadUser();

    }
);


/* =====================================================
   START
   ===================================================== */

await loadUser();

home();

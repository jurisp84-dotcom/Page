<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ScenePlay</title>

<style>

*{
    box-sizing:border-box;
}

:root{
    --bg:#09090d;
    --card:#15151d;
    --card2:#1d1d27;
    --border:#30303b;
    --text:#ffffff;
    --muted:#9999a8;
    --purple:#8b5cf6;
    --purple-light:#b197fc;
    --green:#35d07f;
    --red:#ff5263;
}

body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:Arial,Helvetica,sans-serif;
    padding-bottom:80px;
}

button{
    font:inherit;
    cursor:pointer;
}

.hidden{
    display:none!important;
}

header{
    position:fixed;
    top:0;
    left:0;
    right:0;
    height:64px;
    z-index:100;

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:0 18px;

    background:rgba(9,9,13,.95);
    backdrop-filter:blur(15px);

    border-bottom:1px solid #24242d;
}

.logo{
    font-size:23px;
    font-weight:900;
}

.logo span{
    color:var(--purple-light);
}

.header-button{
    background:var(--card2);
    border:1px solid var(--border);
    color:white;
    padding:9px 14px;
    border-radius:10px;
}

main{
    max-width:760px;
    margin:auto;
    padding:90px 18px 30px;
}

.hero{
    padding:30px 0 40px;
}

.hero h1{
    font-size:clamp(50px,12vw,80px);
    line-height:.9;
    letter-spacing:-5px;
    margin:0;
}

.hero h1 span{
    color:var(--purple-light);
}

.hero p{
    color:var(--muted);
    font-size:18px;
    line-height:1.5;
    max-width:600px;
}

.badge{
    display:inline-block;
    padding:7px 12px;
    border-radius:30px;
    background:#251b37;
    color:var(--purple-light);
    border:1px solid #40305c;
    font-size:12px;
    font-weight:bold;
    margin-bottom:18px;
}

.button-row{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.btn{
    min-height:48px;
    padding:12px 18px;
    border-radius:11px;
    border:0;
    font-weight:bold;
}

.primary{
    background:var(--purple);
    color:white;
}

.primary:hover{
    background:#784bd4;
}

.secondary{
    background:var(--card2);
    color:white;
    border:1px solid var(--border);
}

.danger{
    background:#35151c;
    color:#ff9ca8;
}

.full{
    width:100%;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:17px;
    padding:18px;
}

.card h3{
    margin:8px 0;
}

.card p{
    color:var(--muted);
    line-height:1.5;
}

.emoji{
    font-size:28px;
}

.scene{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:18px;
    padding:18px;
    margin-bottom:15px;
}

.scene h1,
.scene h2,
.scene h3{
    margin-top:10px;
}

.tag{
    display:inline-block;
    background:#251b37;
    color:var(--purple-light);
    border-radius:30px;
    padding:5px 9px;
    font-size:12px;
    font-weight:bold;
}

.muted{
    color:var(--muted);
}

.info{
    background:#101016;
    border:1px solid var(--border);
    padding:14px;
    border-radius:11px;
    margin:10px 0;
    line-height:1.5;
}

.line{
    background:#08080b;
    border-left:4px solid var(--purple);
    border-radius:10px;
    padding:18px;
    font-size:20px;
    line-height:1.45;
    margin:15px 0;
}

.status{
    background:#191921;
    border:1px solid var(--border);
    padding:13px;
    border-radius:11px;
    margin:12px 0;
}

.success{
    background:#10281b;
    color:#8ff0b3;
    border-color:#245d3c;
}

.scene-video{
    width:100%;
    display:block;
    background:#000;
    border-radius:14px;
    margin:15px 0;
    max-height:650px;
}

.camera{
    background:#000;
    border-radius:18px;
    overflow:hidden;
    margin:15px 0;
}

.camera video{
    width:100%;
    display:block;
    aspect-ratio:9/16;
    object-fit:cover;
}

.response{
    background:#101016;
    border:1px solid var(--border);
    border-radius:15px;
    padding:15px;
    margin:12px 0;
}

.user-row{
    display:flex;
    align-items:center;
    gap:10px;
}

.avatar{
    width:42px;
    height:42px;
    border-radius:50%;
    background:linear-gradient(135deg,#8b5cf6,#ec4899);
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
    flex-shrink:0;
}

input{
    width:100%;
    background:#0d0d12;
    border:1px solid #353540;
    color:white;
    padding:14px;
    border-radius:10px;
    margin:7px 0 14px;
}

label{
    font-size:13px;
    color:#c8c8d0;
}

.modal{
    position:fixed;
    inset:0;
    z-index:500;

    background:rgba(0,0,0,.82);

    display:flex;
    align-items:center;
    justify-content:center;

    padding:18px;
}

.modal-box{
    width:min(470px,100%);
    max-height:90vh;
    overflow:auto;

    background:#17171f;
    border:1px solid var(--border);
    border-radius:20px;

    padding:22px;
}

.bottom-nav{
    position:fixed;
    left:0;
    right:0;
    bottom:0;

    height:70px;
    z-index:200;

    background:rgba(15,15,21,.97);
    border-top:1px solid #292933;
    backdrop-filter:blur(15px);
}

.nav{
    max-width:650px;
    height:100%;
    margin:auto;
    display:flex;
}

.nav button{
    flex:1;
    border:0;
    background:none;
    color:#858592;
    font-size:11px;
}

.nav button strong{
    display:block;
    font-size:21px;
    margin-bottom:3px;
}

.nav button.active{
    color:white;
}

.nav button.active strong{
    color:var(--purple-light);
}

.empty{
    text-align:center;
    padding:35px 15px;
    color:var(--muted);
}

@media(max-width:500px){

    main{
        padding-left:14px;
        padding-right:14px;
    }

    .grid{
        grid-template-columns:1fr 1fr;
    }

}

</style>
</head>

/* =====================================================
   AUTH
   ===================================================== */

window.accountAction = function(){

    if(currentUser){

        profile();

    }else{

        openAuth();

    }

};


window.openAuth = function(){

    authMode = "signup";

    document
    .getElementById("authModal")
    .classList
    .remove("hidden");

    updateAuthForm();

};


window.closeAuth = function(){

    document
    .getElementById("authModal")
    .classList
    .add("hidden");

};


window.switchAuth = function(){

    if(authMode === "signup"){

        authMode = "login";

    }else{

        authMode = "signup";

    }

    updateAuthForm();

};


function updateAuthForm(){

    const title =
    document.getElementById(
        "authTitle"
    );

    const username =
    document.getElementById(
        "usernameContainer"
    );

    const submit =
    document.getElementById(
        "authSubmitButton"
    );

    const switchButton =
    document.getElementById(
        "authSwitchButton"
    );


    if(authMode === "login"){

        title.textContent =
        "Log in";

        username.classList.add(
            "hidden"
        );

        submit.textContent =
        "Log in";

        switchButton.textContent =
        "Don't have an account? Create one";

    }else{

        title.textContent =
        "Create account";

        username.classList.remove(
            "hidden"
        );

        submit.textContent =
        "Create account";

        switchButton.textContent =
        "Already have an account? Log in";

    }

}


/* =====================================================
   AUTH SUBMIT
   ===================================================== */

window.submitAuth = async function(){

    const username =
    document.getElementById(
        "authUsername"
    ).value.trim();

    const email =
    document.getElementById(
        "authEmail"
    ).value.trim();

    const password =
    document.getElementById(
        "authPassword"
    ).value;


    if(!email){

        alert(
            "Please enter your email."
        );

        return;

    }


    if(!password){

        alert(
            "Please enter your password."
        );

        return;

    }


    if(authMode === "signup"){

        if(!username){

            alert(
                "Please choose a username."
            );

            return;

        }


        const {
            data,
            error
        } =
        await supabase.auth.signUp({

            email:email,

            password:password,

            options:{

                data:{
                    username:username
                },

                emailRedirectTo:
                "https://businesspage.ie"

            }

        });


        if(error){

            alert(
                error.message
            );

            return;

        }


        closeAuth();

        alert(
            "Account created. Please check your email and confirm your account."
        );


    }else{

        const {
            error
        } =
        await supabase.auth.signInWithPassword({

            email:email,

            password:password

        });


        if(error){

            alert(
                error.message
            );

            return;

        }


        closeAuth();

        await loadUser();

        home();

    }

};


/* =====================================================
   USER
   ===================================================== */

async function loadUser(){

    const {
        data
    } =
    await supabase.auth.getUser();


    currentUser =
    data.user || null;


    currentProfile = null;


    if(currentUser){

        const {
            data:profile
        } =
        await supabase
        .from("profiles")
        .select("*")
        .eq(
            "id",
            currentUser.id
        )
        .maybeSingle();


        currentProfile =
        profile || null;

    }


    updateAccountButton();

}


function updateAccountButton(){

    const button =
    document.getElementById(
        "accountButton"
    );


    if(currentProfile){

        button.textContent =
        "@" +
        currentProfile.username;

    }else if(currentUser){

        button.textContent =
        "Profile";

    }else{

        button.textContent =
        "Log in";

    }

}


/* =====================================================
   LOGOUT
   ===================================================== */

window.logout = async function(){

    await supabase.auth.signOut();

    currentUser = null;
    currentProfile = null;

    updateAccountButton();

    home();

};

window.openCameraForOpening =

function stopCameraTracks(){

    if(cameraStream){

        cameraStream
        .getTracks()
        .forEach(
            track => track.stop()
        );

        cameraStream = null;

    }

}


window.cancelCamera =
function(){

    stopCameraTracks();

    home();

};


/* =====================================================
   RECORD OPENING
   ===================================================== */

window.toggleOpeningRecording =
function(){

    if(
        !mediaRecorder ||
        mediaRecorder.state === "inactive"
    ){

        startOpeningRecording();

    }else{

        stopRecording();

    }

};


function startOpeningRecording(){

    recordedChunks = [];


    let options = {};


    if(
        MediaRecorder
        .isTypeSupported(
            "video/webm;codecs=vp8,opus"
        )
    ){

        options.mimeType =
        "video/webm;codecs=vp8,opus";

    }


    mediaRecorder =
    new MediaRecorder(
        cameraStream,
        options
    );


    mediaRecorder.ondataavailable =
    function(event){

        if(event.data.size > 0){

            recordedChunks.push(
                event.data
            );

        }

    };


    mediaRecorder.onstop =
    function(){

        reviewRecordedVideo();

    };


    mediaRecorder.start();


    recordingSeconds = 0;


    recordingTimer =
    setInterval(function(){

        recordingSeconds++;


        const status =
        document.getElementById(
            "recordStatus"
        );


        if(status){

            status.textContent =
            "🔴 Recording " +
            recordingSeconds +
            " seconds";

        }


        if(recordingSeconds >= 30){

            stopRecording();

        }

    },1000);


    document
    .getElementById(
        "recordButton"

function stopRecording(){

    if(
        mediaRecorder &&
        mediaRecorder.state === "recording"

/* =====================================================

   ===================================================== */

window.uploadOpeningVideo =
async function(){

    if(!pendingVideoBlob){

        alert(
            "There is no recorded video."
        );

        return;

    }


    showLoading(
        "Uploading your scene..."
    );


    try{

        const sceneId =
        crypto.randomUUID();


        /*
            IMPORTANT:
            The video path is saved in the
            database as well as Storage.
        */

        const videoPath =
        currentUser.id +
        "/" +
        sceneId +
        "/opening.webm";


        const {
            error:uploadError
        } =
        await supabase
        .storage
        .from("scene-videos")
        .upload(
            videoPath,
            pendingVideoBlob,
            {
                contentType:"video/webm",
                upsert:false
            }
        );


        if(uploadError){

            throw uploadError;

        }


        /*
            GET THE PUBLIC URL.
        */

        const {
            data:urlData
        } =
        supabase
        .storage
        .from("scene-videos")
        .getPublicUrl(
            videoPath
        );


        const videoUrl =
        urlData.publicUrl;


        console.log(
            "VIDEO URL:",
            videoUrl
        );


        /*
            CREATE THE SCENE.
        */

        const {
            error:sceneError
        } =
        await supabase
        .from("scenes")
        .insert({

            id:sceneId,

            creator_id:
            currentUser.id,

            title:
            currentScene.title,

            category:
            currentScene.category,

            situation:
            currentScene.situation,

            character_a:
            currentScene.characterA,

            character_b:
            currentScene.characterB,

            objective_a:
            currentScene.objectiveA,

            objective_b:
            currentScene.objectiveB,

            opening_line:
            currentScene.lineA,

            status:"open"

        });


        if(sceneError){

            throw sceneError;

        }


        /*
            SAVE THE FIRST TURN.

            This is where the actual video URL
            is connected to the scene.
        */

        const {
            error:turnError
        } =
        await supabase
        .from("scene_turns")
        .insert({

            scene_id:
            sceneId,

            player_id:
            currentUser.id,

            turn_number:1,

            video_path:
            videoUrl

        });


        if(turnError){

            throw turnError;

        }


        pendingVideoBlob = null;


        showPublishedScene(
            sceneId,
            videoUrl
        );


    }catch(error){

        console.error(
            error
        );

        alert(
            "Upload failed:\n\n" +
            error.message
        );

        home();

    }

};

/* =====================================================
   GET OPENING VIDEO
   ===================================================== */

async function getOpeningVideo(
    sceneId
){

    /*
        First try scene_turns.
    */

    const {
        data:turn,
        error
    } =
    await supabase
    .from("scene_turns")
    .select("video_path")
    .eq(
        "scene_id",
        sceneId
    )
    .eq(
        "turn_number",
        1
    )
    .maybeSingle();


    if(
        !error &&
        turn &&
        turn.video_path
    ){

        return turn.video_path;

    }


    /*
        If the database does not return it,
        construct the expected Storage path.
    */

    /*
        We need creator_id to construct it.
        This fallback is mainly for older scenes.
    */

    return null;

}

window.toggleResponseRecording =
function(){

    if(
        !mediaRecorder ||
        mediaRecorder.state === "inactive"
    ){

        startResponseRecording();

    }else{

        stopRecording();

    }

};


function startResponseRecording(){

    recordedChunks = [];


    let options = {};


    if(
        MediaRecorder
        .isTypeSupported(
            "video/webm;codecs=vp8,opus"
        )
    ){

        options.mimeType =
        "video/webm;codecs=vp8,opus";

    }


    mediaRecorder =
    new MediaRecorder(
        cameraStream,
        options
    );


    mediaRecorder.ondataavailable =
    function(event){

        if(event.data.size){

            recordedChunks.push(
                event.data
            );

        }

    };


    mediaRecorder.onstop =
    function(){

        reviewResponse();

    };


    mediaRecorder.start();


    recordingSeconds = 0;


    recordingTimer =
    setInterval(function(){

        recordingSeconds++;


        const status =
        document.getElementById(
            "responseStatus"
        );


        if(status){

            status.textContent =
            "🔴 Recording " +
            recordingSeconds +
            " seconds";

        }


        if(recordingSeconds >= 30){

            stopRecording();

        }

    },1000);


    document
    .getElementById(
        "responseRecordButton"
    )
    .textContent =
    "⏹ Stop";

}

/* =====================================================
   ESCAPE HTML
   ===================================================== */

function escapeHtml(value){

    if(
        value === null ||
        value === undefined
    ){

        return "";

    }


    return String(value)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}

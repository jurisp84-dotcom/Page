<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#09090d">
<title>ScenePlay — Act. Respond. Play.</title>

<style>
:root{
  --bg:#09090d;
  --card:#15151d;
  --card2:#1d1d27;
  --border:#2b2b37;
  --text:#fff;
  --muted:#9999a8;
  --purple:#8b5cf6;
  --purple2:#a78bfa;
  --green:#35d07f;
  --red:#ff5263;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  padding:0;
  background:var(--bg);
  color:var(--text);
  font-family:Inter,Arial,sans-serif;
  min-height:100%;
}

body{
  padding-bottom:80px;
}

button{
  font:inherit;
  cursor:pointer;
  border:0;
}

.hidden{display:none!important}

header{
  position:fixed;
  top:0;
  left:0;
  right:0;
  height:64px;
  z-index:100;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
  background:rgba(9,9,13,.94);
  backdrop-filter:blur(15px);
  border-bottom:1px solid #20202a;
}

.logo{
  font-size:21px;
  font-weight:900;
  letter-spacing:-.7px;
}

.logo span{color:var(--purple2)}

.header-btn{
  background:var(--card2);
  color:white;
  border:1px solid var(--border);
  padding:9px 13px;
  border-radius:10px;
}

main{
  width:100%;
  max-width:760px;
  margin:auto;
  padding:88px 18px 30px;
}

.hero{
  padding:35px 0 30px;
}

.hero-badge{
  display:inline-block;
  background:#211936;
  color:var(--purple2);
  border:1px solid #3d2d5d;
  padding:7px 11px;
  border-radius:30px;
  font-size:13px;
  font-weight:700;
  margin-bottom:20px;
}

.hero h1{
  font-size:clamp(44px,12vw,76px);
  line-height:.91;
  letter-spacing:-4px;
  margin:0;
}

.hero h1 span{
  color:var(--purple2);
}

.hero p{
  color:var(--muted);
  font-size:18px;
  line-height:1.55;
  max-width:600px;
  margin:22px 0;
}

.btn{
  min-height:50px;
  padding:13px 19px;
  border-radius:12px;
  font-weight:800;
  transition:.15s;
}

.btn:active{transform:scale(.97)}

.primary{
  background:var(--purple);
  color:white;
}

.primary:hover{background:#7c4de0}

.secondary{
  background:var(--card2);
  color:white;
  border:1px solid var(--border);
}

.green{
  background:#1b3b2a;
  color:#8ff0b6;
  border:1px solid #285a3e;
}

.danger{
  background:#361820;
  color:#ff9da8;
}

.full{width:100%}

.button-row{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.section-title{
  margin:32px 0 14px;
  font-size:22px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:17px;
  padding:17px;
}

.card h3{
  margin:0 0 8px;
  font-size:17px;
}

.card p{
  margin:0;
  color:var(--muted);
  line-height:1.5;
}

.emoji{
  font-size:30px;
  margin-bottom:12px;
}

.scene-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
  padding:18px;
  margin-bottom:12px;
}

.scene-card h2{
  margin:5px 0 8px;
}

.tag{
  display:inline-block;
  background:#241b35;
  color:var(--purple2);
  border-radius:30px;
  padding:5px 9px;
  font-size:12px;
  font-weight:700;
}

.muted{color:var(--muted)}

.line{
  background:#08080b;
  border-left:4px solid var(--purple);
  border-radius:10px;
  padding:18px;
  margin:20px 0;
  font-size:22px;
  line-height:1.45;
}

.info{
  background:#111118;
  border:1px solid var(--border);
  padding:15px;
  border-radius:12px;
  color:#c7c7d0;
  line-height:1.5;
}

.camera{
  position:relative;
  background:#000;
  border-radius:20px;
  overflow:hidden;
  margin:18px 0;
  min-height:300px;
}

.camera video{
  width:100%;
  display:block;
  background:#000;
  aspect-ratio:9/16;
  object-fit:cover;
  max-height:70vh;
}

.camera-text{
  position:absolute;
  left:15px;
  right:15px;
  bottom:15px;
  padding:12px;
  background:rgba(0,0,0,.65);
  border-radius:12px;
  font-size:16px;
}

.record-dot{
  color:#ff4053;
  font-weight:900;
}

.timer{
  font-size:20px;
  margin-top:5px;
}

.feed-item{
  background:#101016;
  border:1px solid var(--border);
  border-radius:18px;
  overflow:hidden;
  margin-bottom:18px;
}

.fake-video{
  aspect-ratio:9/14;
  background:linear-gradient(145deg,#191420,#09090d);
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:30px;
}

.fake-video .play{
  width:62px;
  height:62px;
  border-radius:50%;
  background:rgba(255,255,255,.12);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:25px;
  margin:auto auto 15px;
}

.feed-info{
  padding:15px;
}

.feed-actions{
  display:flex;
  gap:8px;
  margin-top:13px;
}

.icon-btn{
  background:var(--card2);
  color:white;
  border:1px solid var(--border);
  padding:9px 12px;
  border-radius:10px;
}

.response{
  background:#101016;
  border:1px solid var(--border);
  padding:15px;
  border-radius:15px;
  margin-bottom:12px;
}

.response.selected{
  border-color:var(--purple);
  background:#171323;
}

.avatar{
  width:40px;
  height:40px;
  border-radius:50%;
  background:linear-gradient(135deg,#8b5cf6,#ec4899);
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:900;
  margin-right:10px;
}

.user-row{
  display:flex;
  align-items:center;
  margin-bottom:12px;
}

.status{
  padding:13px;
  border-radius:11px;
  background:#181820;
  color:#c9c9d3;
  margin:14px 0;
}

.success{
  background:#11291c;
  color:#8ef0b3;
  border:1px solid #214c32;
}

.warning{
  background:#292313;
  color:#f1d279;
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.78);
  z-index:500;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:18px;
}

.modal-box{
  width:min(480px,100%);
  background:#17171f;
  border:1px solid var(--border);
  border-radius:20px;
  padding:22px;
}

.modal-box h2{
  margin-top:0;
}

input{
  width:100%;
  background:#0d0d12;
  color:white;
  border:1px solid #34343f;
  padding:14px;
  border-radius:10px;
  margin:7px 0 14px;
  outline:none;
}

input:focus{
  border-color:var(--purple);
}

label{
  color:#c6c6d0;
  font-size:13px;
}

.bottom-nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  height:70px;
  z-index:200;
  background:rgba(15,15,21,.96);
  backdrop-filter:blur(15px);
  border-top:1px solid #292933;
  display:flex;
  justify-content:center;
}

.nav-inner{
  width:min(600px,100%);
  display:flex;
  justify-content:space-around;
}

.nav-btn{
  flex:1;
  background:none;
  color:#8e8e9b;
  font-size:11px;
  padding-top:8px;
}

.nav-btn strong{
  display:block;
  font-size:21px;
  margin-bottom:3px;
}

.nav-btn.active{
  color:white;
}

.nav-btn.active strong{
  color:var(--purple2);
}

hr{
  border:0;
  border-top:1px solid var(--border);
  margin:22px 0;
}

@media(max-width:500px){
  .grid{
    grid-template-columns:1fr 1fr;
  }

  .button-row .btn{
    flex:1;
  }

  .hero h1{
    letter-spacing:-3px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">Scene<span>Play</span></div>

  <button id="headerLogin"
          class="header-btn"
          onclick="openLogin()">
    Log in
  </button>
</header>

<main id="app"></main>

<nav class="bottom-nav">
  <div class="nav-inner">

    <button class="nav-btn active"
            onclick="home()">
      <strong>⌂</strong>
      Home
    </button>

    <button class="nav-btn"
            onclick="discover()">
      <strong>🔥</strong>
      Discover
    </button>

    <button class="nav-btn"
            onclick="createScene()">
      <strong>＋</strong>
      Create
    </button>

    <button class="nav-btn"
            onclick="myScenes()">
      <strong>🎬</strong>
      My Scenes
    </button>

    <button class="nav-btn"
            onclick="profile()">
      <strong>●</strong>
      Profile
    </button>

  </div>
</nav>


<!-- LOGIN -->

<div id="loginModal" class="modal hidden">

  <div class="modal-box">

    <h2>Join ScenePlay</h2>

    <p class="muted">
      Watching is free without an account.
      You need an account to play.
    </p>

    <label>Username</label>
    <input id="username"
           placeholder="Choose a username"
           maxlength="20">

    <label>Email</label>
    <input id="email"
           type="email"
           placeholder="you@example.com">

    <div class="button-row">

      <button class="btn primary"
              onclick="login()">
        Create account
      </button>

      <button class="btn secondary"
              onclick="closeLogin()">
        Cancel
      </button>

    </div>

  </div>

</div>


<script>

/* =========================================================
   SCENEPLAY FRONT-END MVP
   =========================================================

   This version works as a GitHub Pages prototype.

   It DOES:
   ✓ Mobile interface
   ✓ Scene selection
   ✓ Camera recording
   ✓ 30-second recording
   ✓ Review/retake
   ✓ Scene flow
   ✓ Simulated multiple responses
   ✓ Choose a responder
   ✓ Finished scene flow
   ✓ Local profile/state

   It DOES NOT yet provide:
   ✗ Real accounts
   ✗ Real multi-user communication
   ✗ Server video storage
   ✗ Push notifications
   ✗ Real moderation backend

   Those require a backend.
*/


const SCENES = [

{
 id:1,
 title:"The Betrayal",
 category:"Drama",
 situation:"You discover that your best friend has been hiding something important from you.",
 A:"The suspicious friend",
 B:"The friend hiding the secret",
 objectiveA:"You're angry, but you're trying to stay controlled.",
 objectiveB:"You're nervous and want to avoid admitting the truth.",
 lineA:"I know you've been lying to me.",
 lineB:"What are you talking about?",
 nextA:"Don't lie to me. I saw you.",
 nextB:"You weren't supposed to see that."
},

{
 id:2,
 title:"Wrong Number",
 category:"Comedy",
 situation:"You accidentally call a stranger, but they seem to know exactly who you are.",
 A:"The person who made the wrong call",
 B:"A mysterious stranger",
 objectiveA:"Try to understand what is happening.",
 objectiveB:"Act as though everything is completely normal.",
 lineA:"Sorry, I think I have the wrong number.",
 lineB:"No. I think you finally called the right one.",
 nextA:"Have we met before?",
 nextB:"Not exactly."
},

{
 id:3,
 title:"The Last Train",
 category:"Romance",
 situation:"One person is leaving forever. The other has one last chance to stop them.",
 A:"The person who wants them to stay",
 B:"The person leaving",
 objectiveA:"Don't admit how much you care.",
 objectiveB:"Pretend you don't want to stay.",
 lineA:"So you're really leaving?",
 lineB:"You knew I would eventually.",
 nextA:"I didn't think you'd actually do it.",
 nextB:"Maybe you should have said something sooner."
},

{
 id:4,
 title:"The Interview",
 category:"Drama",
 situation:"A normal job interview suddenly becomes strangely personal.",
 A:"The interviewer",
 B:"The applicant",
 objectiveA:"Remain professional while testing the applicant.",
 objectiveB:"Stay calm even though something feels wrong.",
 lineA:"Before we continue, I need to ask you something.",
 lineB:"Of course. What is it?",
 nextA:"Where were you last Friday night?",
 nextB:"Why would that matter for this job?"
},

{
 id:5,
 title:"The Stranger",
 category:"Mystery",
 situation:"A stranger approaches you and says they know something about your future.",
 A:"The person being approached",
 B:"The mysterious stranger",
 objectiveA:"Don't reveal that you're frightened.",
 objectiveB:"Make them believe you know more than you really do.",
 lineA:"Do I know you?",
 lineB:"Not yet.",
 nextA:"What does that mean?",
 nextB:"You'll understand soon."
},

{
 id:6,
 title:"The Apology",
 category:"Drama",
 situation:"Two friends meet after years without speaking.",
 A:"The person who was hurt",
 B:"The person who wants forgiveness",
 objectiveA:"You want an apology but don't make it easy.",
 objectiveB:"You genuinely want another chance.",
 lineA:"Why are you here?",
 lineB:"Because I owe you an apology.",
 nextA:"That doesn't fix what happened.",
 nextB:"I know."
}

];


let state = JSON.parse(
 localStorage.getItem("scenePlay")
 || '{"username":null,"myScenes":[]}'
);

let currentScene = null;
let currentRole = "A";
let currentPartner = null;

let stream = null;
let recorder = null;
let chunks = [];
let timer = null;
let seconds = 0;


/* ---------------- STORAGE ---------------- */

function save(){
 localStorage.setItem(
   "scenePlay",
   JSON.stringify(state)
 );
}


/* ---------------- LOGIN ---------------- */

function openLogin(){
 document.getElementById("loginModal")
   .classList.remove("hidden");
}

function closeLogin(){
 document.getElementById("loginModal")
   .classList.add("hidden");
}

function login(){

 const name =
   document.getElementById("username")
   .value.trim();

 const email =
   document.getElementById("email")
   .value.trim();

 if(!name || !email){
   alert("Please enter your username and email.");
   return;
 }

 state.username=name;
 state.email=email;

 save();
 closeLogin();
 updateHeader();
 home();
}

function updateHeader(){

 const b=document.getElementById("headerLogin");

 if(state.username){
   b.textContent="@"+state.username;
   b.onclick=profile;
 }else{
   b.textContent="Log in";
   b.onclick=openLogin;
 }
}


/* ---------------- HOME ---------------- */

function home(){

 updateHeader();

 app.innerHTML=`

 <section class="hero">

   <div class="hero-badge">
     🎭 PLAY WITH ANYONE
   </div>

   <h1>
     Act.<br>
     <span>Respond.</span><br>
     Play.
   </h1>

   <p>
     Get a scene. Record your part.
     Someone else responds.
     Continue whenever you're ready.
   </p>

   <div class="button-row">

     <button class="btn primary"
             onclick="createScene()">
       🎬 Start a Scene
     </button>

     <button class="btn secondary"
             onclick="discover()">
       👀 Watch Scenes
     </button>

   </div>

 </section>


 <h2 class="section-title">
   How it works
 </h2>

 <div class="grid">

   <div class="card">
     <div class="emoji">🎬</div>
     <h3>Get a scene</h3>
     <p>
       Choose a situation and
       become a character.
     </p>
   </div>

   <div class="card">
     <div class="emoji">📱</div>
     <h3>Record alone</h3>
     <p>
       Your phone is your camera.
       No one else is needed.
     </p>
   </div>

   <div class="card">
     <div class="emoji">👥</div>
     <h3>People respond</h3>
     <p>
       Many people can try the
       other character.
     </p>
   </div>

   <div class="card">
     <div class="emoji">🌎</div>
     <h3>Make it public</h3>
     <p>
       Only finished scenes are
       shown to everyone.
     </p>
   </div>

 </div>


 <h2 class="section-title">
   🔥 Popular
 </h2>

 <div class="scene-card">

   <span class="tag">Drama</span>

   <h2>The Secret</h2>

   <p class="muted">
     "I know what you did."
   </p>

   <button class="btn secondary full"
           onclick="alert('Demo scene — public scenes will play here.')">
     ▶ Watch
   </button>

 </div>

 `;
}


/* ---------------- DISCOVER ---------------- */

function discover(){

 app.innerHTML=`

 <h1>🔥 Discover</h1>

 <p class="muted">
   Only completed scenes appear here.
 </p>

 `;

 const examples=[
   ["The Secret","Drama","Alex & Sarah","1.2K"],
   ["Wrong Number","Comedy","Mike & Emma","842"],
   ["The Last Train","Romance","Jamie & Chris","637"]
 ];

 examples.forEach(x=>{

   app.innerHTML+=`

   <div class="feed-item">

     <div class="fake-video">

       <div>

         <div class="play">▶</div>

         <strong>${x[0]}</strong>

         <div class="muted">
           Finished scene
         </div>

       </div>

     </div>

     <div class="feed-info">

       <span class="tag">${x[1]}</span>

       <h2>${x[0]}</h2>

       <div class="muted">
         ${x[2]} · ${x[3]} views
       </div>

       <div class="feed-actions">

         <button class="icon-btn"
                 onclick="like(this)">
           ♡
         </button>

         <button class="icon-btn"
                 onclick="alert('Comments will be available in the real version.')">
           💬
         </button>

         <button class="icon-btn"
                 onclick="share()">
           ↗
         </button>

       </div>

     </div>

   </div>

   `;

 });

}


/* ---------------- CREATE ---------------- */

function createScene(){

 if(!state.username){
   openLogin();
   return;
 }

 app.innerHTML=`

 <h1>🎬 Start a Scene</h1>

 <p class="muted">
   Choose a situation. The app gives
   you your character and opening line.
 </p>

 <div class="grid">

 ${SCENES.map(s=>`

   <div class="card">

     <div class="emoji">
       ${categoryEmoji(s.category)}
     </div>

     <span class="tag">
       ${s.category}
     </span>

     <h3>${s.title}</h3>

     <p>${s.situation}</p>

     <br>

     <button class="btn primary full"
             onclick="previewScene(${s.id})">
       Play
     </button>

   </div>

 `).join("")}

 </div>

 `;

}


function categoryEmoji(c){

 if(c==="Comedy")return"😂";
 if(c==="Romance")return"❤️";
 if(c==="Mystery")return"🕵️";
 if(c==="Drama")return"🎭";

 return"🎬";
}


/* ---------------- PREVIEW ---------------- */

function previewScene(id){

 currentScene=
   SCENES.find(x=>x.id===id);

 currentRole="A";

 app.innerHTML=`

 <div class="scene-card">

   <span class="tag">
     ${currentScene.category}
   </span>

   <h1>
     ${currentScene.title}
   </h1>

   <hr>

   <strong>Situation</strong>

   <p class="muted">
     ${currentScene.situation}
   </p>

   <br>

   <strong>Your character</strong>

   <p class="muted">
     ${currentScene.A}
   </p>

   <strong>Other character</strong>

   <p class="muted">
     ${currentScene.B}
   </p>

   <div class="info">
     <strong>Your objective</strong><br>
     ${currentScene.objectiveA}
   </div>

   <div class="line">
     "${currentScene.lineA}"
   </div>

   <button class="btn primary full"
           onclick="openCamera('A')">
     🎥 Record Opening
   </button>

 </div>

 `;

}


/* ---------------- CAMERA ---------------- */

async function openCamera(role){

 currentRole=role;

 const line =
   role==="A"
   ? currentScene.lineA
   : currentScene.nextB;

 const objective =
   role==="A"
   ? currentScene.objectiveA
   : currentScene.objectiveB;

 app.innerHTML=`

 <h1>📱 Your turn</h1>

 <div class="info">
   <strong>Your objective</strong><br>
   ${objective}
 </div>

 <div class="line">
   "${line}"
 </div>

 <div class="camera">

   <video id="preview"
          autoplay
          muted
          playsinline></video>

   <div class="camera-text">

     <div id="recordState">
       Ready
     </div>

     <div id="clock"
          class="timer">
       00:00
     </div>

   </div>

 </div>

 <div class="button-row">

   <button id="recordBtn"
           class="btn primary"
           onclick="toggleRecord()">
     🔴 Record
   </button>

   <button class="btn secondary"
           onclick="stopCamera()">
     Cancel
   </button>

 </div>

 <p class="muted">
   Maximum recording length: 30 seconds.
 </p>

 `;

 try{

   stream=
     await navigator.mediaDevices.getUserMedia({
       video:{
         facingMode:"user"
       },
       audio:true
     });

   document.getElementById("preview")
     .srcObject=stream;

 }catch(e){

   alert(
     "Camera or microphone access was denied. " +
     "Please allow access in your browser."
   );

   home();
 }

}


/* ---------------- RECORDING ---------------- */

function toggleRecord(){

 if(!recorder){
   startRecord();
 }else if(recorder.state==="recording"){
   stopRecord();
 }

}


function startRecord(){

 chunks=[];

 let options={};

 if(MediaRecorder.isTypeSupported("video/webm")){
   options.mimeType="video/webm";
 }

 try{
   recorder=
     new MediaRecorder(stream,options);
 }catch(e){
   recorder=
     new MediaRecorder(stream);
 }

 recorder.ondataavailable=e=>{
   if(e.data.size>0)
     chunks.push(e.data);
 };

 recorder.onstop=reviewRecording;

 recorder.start();

 seconds=0;

 timer=setInterval(()=>{

   seconds++;

   document.getElementById("clock")
     .textContent=formatTime(seconds);

   if(seconds>=30)
     stopRecord();

 },1000);

 document.getElementById("recordBtn")
   .textContent="⏹ Stop";

 document.getElementById("recordState")
   .innerHTML=
   '<span class="record-dot">● RECORDING</span>';
}


function stopRecord(){

 if(!recorder)return;

 recorder.stop();

 clearInterval(timer);

 document.getElementById("recordBtn")
   .disabled=true;
}


function formatTime(s){

 return "00:"+
   String(s).padStart(2,"0");

}


/* ---------------- REVIEW ---------------- */

function reviewRecording(){

 stopTracks();

 const blob=
   new Blob(chunks,{type:"video/webm"});

 const url=
   URL.createObjectURL(blob);

 app.innerHTML=`

 <h1>Review</h1>

 <p class="muted">
   Happy with your performance?
 </p>

 <div class="camera">

   <video src="${url}"
          controls
          playsinline></video>

 </div>

 <div class="button-row">

   <button class="btn secondary"
           onclick="openCamera('${currentRole}')">
     ↻ Retake
   </button>

   <button class="btn primary"
           onclick="submitRecording('${url}')">
     ✓ Use Video
   </button>

 </div>

 `;

}


function stopTracks(){

 if(stream){

   stream.getTracks()
     .forEach(t=>t.stop());

   stream=null;
 }

 recorder=null;
}


/* ---------------- SUBMIT ---------------- */

function submitRecording(url){

 if(currentRole==="A"){

   const scene={
     id:Date.now(),
     sceneId:currentScene.id,
     title:currentScene.title,
     category:currentScene.category,
     opening:url,
     status:"waiting",
     created:new Date().toISOString()
   };

   state.myScenes.push(scene);

   save();

   waiting(scene);

 }else{

   responseSent();

 }

}


/* ---------------- WAITING ---------------- */

function waiting(scene){

 app.innerHTML=`

 <div class="scene-card">

   <span class="tag">
     ${scene.category}
   </span>

   <h1>${scene.title}</h1>

   <div class="status success">
     ✓ Your opening is live.
   </div>

   <p class="muted">
     Other people can now respond
     as the other character.
   </p>

   <video class="feed-video"
          src="${scene.opening}"
          controls></video>

   <div class="info">
     👥 Waiting for people to respond.
   </div>

   <div class="button-row">

     <button class="btn primary"
             onclick="showResponses()">
       👥 See Responses
     </button>

     <button class="btn secondary"
             onclick="share()">
       ↗ Share
     </button>

   </div>

 </div>

 `;

}


/* ---------------- DEMO RESPONSES ---------------- */

function showResponses(){

 app.innerHTML=`

 <h1>👥 Responses</h1>

 <p class="muted">
   These responses are private.
   Only you can see them.
 </p>

 ${responseCard("Alex",
   "What are you talking about?","😂")}

 ${responseCard("Sarah",
   "You're going to have to be more specific.","🎭")}

 ${responseCard("Mike",
   "I was hoping you wouldn't find out.","😈")}

 <button class="btn secondary full"
         onclick="myScenes()">
   Back
 </button>

 `;

}


function responseCard(name,line,emoji){

 return`

 <div class="response">

   <div class="user-row">

     <div class="avatar">
       ${name[0]}
     </div>

     <strong>${name}</strong>

   </div>

   <div class="line">
     "${line}"
   </div>

   <button class="btn primary full"
           onclick="choosePartner('${name}')">
     ${emoji} Continue with ${name}
   </button>

   <br><br>

   <button class="btn danger full"
           onclick="alert('This response has been passed.')">
     Pass
   </button>

 </div>

 `;

}


/* ---------------- CHOOSE PARTNER ---------------- */

function choosePartner(name){

 currentPartner=name;

 const scene=
   state.myScenes[state.myScenes.length-1];

 currentScene=
   SCENES.find(
     x=>x.id===scene.sceneId
   );

 appStateSave();

 nextTurn();

}


function appStateSave(){
 save();
}


/* ---------------- NEXT TURN ---------------- */

function nextTurn(){

 currentRole="A";

 app.innerHTML=`

 <div class="scene-card">

   <span class="tag">
     YOUR TURN
   </span>

   <h1>${currentScene.title}</h1>

   <p>
     <strong>${currentPartner}</strong>
     has responded.
   </p>

   <div class="info">
     You are still playing:
     <strong>${currentScene.A}</strong>
   </div>

   <div class="line">
     "${currentScene.nextA}"
   </div>

   <button class="btn primary full"
           onclick="openCamera('A')">
     🎥 Record Response
   </button>

 </div>

 `;

}


/* ---------------- RESPONSE SENT ---------------- */

function responseSent(){

 stopTracks();

 app.innerHTML=`

 <div class="scene-card">

   <div class="status success">
     ✓ Response sent
   </div>

   <h1>
     Now you wait.
   </h1>

   <p class="muted">
     The other player can respond whenever
     they're ready — even tomorrow.
   </p>

   <button class="btn secondary full"
           onclick="home()">
     Home
   </button>

 </div>

 `;

}


/* ---------------- MY SCENES ---------------- */

function myScenes(){

 if(!state.username){
   openLogin();
   return;
 }

 app.innerHTML=`

 <h1>🎬 My Scenes</h1>

 `;

 if(!state.myScenes.length){

   app.innerHTML+=`

   <div class="info">
     You haven't started any scenes yet.
   </div>

   <br>

   <button class="btn primary full"
           onclick="createScene()">
     Start your first scene
   </button>

   `;

   return;
 }


 state.myScenes
 .slice()
 .reverse()
 .forEach(scene=>{

   app.innerHTML+=`

   <div class="scene-card">

     <span class="tag">
       ${scene.category}
     </span>

     <h2>${scene.title}</h2>

     <div class="status warning">
       ⏳ Waiting for responses
     </div>

     <button class="btn primary full"
             onclick="showResponses()">
       View Responses
     </button>

   </div>

   `;

 });

}


/* ---------------- PROFILE ---------------- */

function profile(){

 if(!state.username){
   openLogin();
   return;
 }

 app.innerHTML=`

 <div class="scene-card">

   <div class="avatar">
     ${state.username[0].toUpperCase()}
   </div>

   <h1>@${state.username}</h1>

   <p class="muted">
     ScenePlay player
   </p>

   <hr>

   <div class="grid">

     <div class="card">
       <h3>${state.myScenes.length}</h3>
       <p>Scenes started</p>
     </div>

     <div class="card">
       <h3>0</h3>
       <p>Finished</p>
     </div>

   </div>

   <br>

   <button class="btn danger full"
           onclick="logout()">
     Log out
   </button>

 </div>

 `;

}


function logout(){

 state.username=null;
 state.email=null;

 save();

 updateHeader();
 home();

}


/* ---------------- LIKE / SHARE ---------------- */

function like(btn){

 btn.textContent=
   btn.textContent==="♡"
   ? "♥"
   : "♡";

}


async function share(){

 const data={
   title:"ScenePlay",
   text:"Play a scene with someone!",
   url:location.href
 };

 if(navigator.share){

   try{
     await navigator.share(data);
   }catch(e){}

 }else{

   try{
     await navigator.clipboard
       .writeText(location.href);

     alert("Link copied!");

   }catch(e){

     alert(location.href);

   }

 }

}


/* ---------------- START ---------------- */

updateHeader();
home();

</script>

</body>
</html>
